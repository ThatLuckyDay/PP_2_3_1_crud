<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
<!-- Header with user info -->
<div class="header-info">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <span th:text="${principal.email}" class="email-head"></span>
            <span th:text="' with roles: '" style="color: white;"></span>
            <span th:each="role : ${principal.roles}"
                  class="roles-head"
                  th:text="${#strings.substringAfter(role.authority,'ROLE_')} + ' '">
                </span>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>
</div>

<div class="main-container d-flex" >
    <!-- Sidebar Navigation -->
    <div class="left-sidebar d-flex flex-column flex-shrink-0 bg-body-tertiary">
        <ul class="nav nav-pills flex-column mb-auto" id="role-pages">
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a href="#admin-page" class="nav-link active" data-bs-toggle="tab">
                    Admin
                </a>
            </li>
            <li class="nav-item">
                <a href="#user-page" class="nav-link" data-bs-toggle="tab">
                    User
                </a>
            </li>
        </ul>
    </div>

    <!-- Content area -->
    <div class="content-area">
        <div class="tab-content" id="pagesContent">
            <div th:replace="~{pages/admin-page :: admin-page}"></div>
            <div th:replace="~{pages/user-page :: user-page}"></div>
        </div>
    </div>
</div>

<div th:replace="~{modals/management :: management}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/mapper.js}"></script>

</body>

</html>
