<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
<!-- Header with user info -->
<div class="header-info">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <span id="email-head" class="fs-5 fw-bold text-white"></span>
            <span class="text-white"> with roles: </span>
            <span id="roles-head" class="text-white"></span>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>
</div>

<!-- Page content -->
<div class="main-container d-flex">
    <!-- Sidebar Navigation -->
    <div class="left-sidebar d-flex flex-column flex-shrink-0 bg-body-tertiary">
        <ul class="nav nav-pills flex-column mb-auto" id="role-pages">
            <li class="nav-item">
                <a href="#admin-page" class="nav-link active" data-bs-toggle="tab"> Admin </a>
            </li>
            <li class="nav-item">
                <a href="#user-page" class="nav-link" data-bs-toggle="tab"> User </a>
            </li>
        </ul>
    </div>
    <!-- Content area -->
    <div class="content-area">
        <div class="tab-content" id="pagesContent">
            <div th:replace="~{pages/admin-page :: admin-page}"></div>
            <div th:replace="~{pages/user-page :: user-page}"></div>
        </div>
    </div>
</div>

<div th:replace="~{modals/management :: management}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/header.js}"></script>
<script th:src="@{/js/admin.js}"></script>
<script th:src="@{/js/user.js}"></script>
<script th:src="@{/js/management.js}"></script>

</body>

</html>
