<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Page</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        div {
            margin-bottom: 10px;
        }
        .container {
            margin-top: 20px;
        }
        .container input {
            margin-right: 10px;
        }
        .roles {
            display: inline-block;
        }
    </style>
</head>

<body>

<h1>Admin Page</h1>

<div class="container">
    <h2>User Data</h2>
    <form th:action="@{/admin}" th:object="${formUser}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div>
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" th:field="*{firstName}" required/>
        </div>

        <div>
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" th:field="*{lastName}" required/>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{email}" required/>
        </div>

        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" th:field="*{username}" required/>
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="text" id="password" th:field="*{password}" required/>
        </div>

        <div>
            <label>Roles:</label>
            <div th:each="role : ${roles}" class="roles">
                <input type="checkbox" th:value="${role.id}" th:id="${'role-' + role.id}" name="roleIds"
                       th:checked="${not #lists.isEmpty(formUser.roles) and formUser.roles.![id].contains(role.id)}">
                <label th:for="${'role-' + role.id}" th:text="${role.authority}"></label>
            </div>
        </div>

        <div>
            <label for="newRole">Role: ROLE_ +</label>
            <input type="text" id="newRole" name="newRole"/>
        </div>

        <button type="submit">Save</button>
    </form>
</div>

<h2>User List</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Username</th>
        <th>Roles</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.firstName}"></td>
        <td th:text="${user.lastName}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.username}"></td>
        <td>
            <span th:each="role,iterStat : ${user.roles}"
                  th:text="${role.authority} + (${not iterStat.last} ? ', ' : '')"></span>
            <span th:if="${#lists.isEmpty(user.roles)}">No roles</span>
        </td>
        <td>
            <a th:href="@{/admin/edit(id=${user.id})}">Edit</a>
            <a th:href="@{/admin/delete(id=${user.id})}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<form th:action="@{/logout}" method="post" class="container">
    <input type="submit" value="Logout"/>
</form>
</body>

</html>
