<div th:fragment="admin-page" class="tab-pane fade show active" id="admin-page" role="tabpanel">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Admin panel</h2>
    </div>

    <!-- Вкладки -->
    <ul class="nav nav-tabs" id="adminTabs">
        <li class="nav-item">
            <a class="nav-link active" data-bs-toggle="tab" href="#usersTab">Users table</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" data-bs-toggle="tab" href="#createUserTab">New User</a>
        </li>
    </ul>

    <!-- Администрирование -->
    <div class="tab-content border border-2">
        <!-- Таблица пользователей -->
        <div class="tab-pane fade show active" id="usersTab">
            <h4 class="mb-3 mt-3">All users</h4>
            <div class="table-responsive bg-light px-4">
                <table  id="usersTable" class="table table-striped table-hover border-top mt-4 mb-4">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- Форма создания пользователя -->
        <div class="tab-pane fade" id="createUserTab">
            <h4 class="m-3">Add new user</h4>
            <form id="createUserForm" class="bg-white fw-bold py-4 d-flex flex-column align-items-center text-center">
            </form>
        </div>
    </div>
</div>
