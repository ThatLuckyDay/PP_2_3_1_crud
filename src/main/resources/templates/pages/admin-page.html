<div th:fragment="admin-page" class="tab-pane fade show active" id="admin-page" role="tabpanel"
     sec:authorize="hasRole('ADMIN')">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Admin panel</h2>
    </div>

    <!-- Вкладки -->
    <ul class="nav nav-tabs" id="adminTabs">
        <li class="nav-item">
            <a class="nav-link active" data-bs-toggle="tab" href="#usersTab">Users table</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" data-bs-toggle="tab" href="#newUserTab">New User</a>
        </li>
    </ul>

    <!-- Администрирование -->
    <div class="tab-content border border-2">
        <!-- Таблица пользователей -->
        <div class="tab-pane fade show active" id="usersTab">
            <h4 class="mb-3 mt-3">All users</h4>
            <div class="table-responsive bg-light px-4">
                <table class="table table-striped table-hover border-top mt-4 mb-4">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.lastName}"></td>
                        <td th:text="${user.age}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                            <span th:each="role : ${roles}"
                                  th:text="${#strings.substringAfter(role.authority,'ROLE_')} + ' '"></span>
                        </td>
                        <td class="action-buttons">
                            <!-- Edit Button -->
                            <button type="button"
                                    class="btn btn-sm btn-primary"
                                    data-bs-toggle="modal"
                                    data-bs-target="#editModal"
                                    th:attr="data-bs-user-id=${user.id},
                                             data-bs-first-name=${user.firstName},
                                             data-bs-last-name=${user.lastName},
                                             data-bs-age=${user.age},
                                             data-bs-email=${user.email},
                                             data-bs-roles=${#strings.listJoin(user.roles.![authority], ',')}">
                                Edit
                            </button>
                        </td>

                        <td class="action-buttons">
                            <!-- Delete Button -->
                            <button type="button"
                                    class="btn btn-sm btn-danger"
                                    data-bs-toggle="modal"
                                    data-bs-target="#deleteModal"
                                    th:attr="data-bs-user-id=${user.id},
                                             data-bs-first-name=${user.firstName},
                                             data-bs-last-name=${user.lastName},
                                             data-bs-age=${user.age},
                                             data-bs-email=${user.email},
                                             data-bs-roles=${#strings.listJoin(user.roles.![authority], ',')}">
                                Delete
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Форма создания пользователя -->
        <div class="tab-pane fade" id="newUserTab">
            <h4 class="m-3">Add new user</h4>
            <form th:object="${formUser}" th:action="@{/admin/new}" th:method="POST"
                  class="bg-white fw-bold py-4 d-flex flex-column align-items-center text-center">
                <div class="mb-3 w-25 mx-auto">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control" th:field="*{firstName}" required/>
                </div>
                <div class="mb-3 w-25 mx-auto">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" th:field="*{lastName}" required/>
                </div>
                <div class="mb-3 w-25 mx-auto">
                    <label class="form-label">Age</label>
                    <input type="number" class="form-control" th:field="*{age}" required/>
                </div>
                <div class="mb-3 w-25 mx-auto">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" th:field="*{email}" required/>
                </div>
                <div class="mb-3 w-25 mx-auto">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" th:field="*{password}" required/>
                </div>
                <div class="mb-3 w-25 mx-auto">
                    <label class="form-label">Role</label>
                    <div class="form-check text-start fw-normal">
                        <input class="form-check-input" type="checkbox" id="roleAdmin" name="roles" value="ADMIN">
                        <label class="form-check-label" for="roleAdmin">ADMIN</label>
                    </div>
                    <div class="form-check text-start fw-normal">
                        <input class="form-check-input" type="checkbox" id="roleUser" name="roles" value="USER">
                        <label class="form-check-label" for="roleUser">USER</label>
                    </div>
                </div>
                <div class="d-flex justify-content-center">
                    <button type="submit" class="btn btn-success">Add new user</button>
                </div>
            </form>
        </div>
    </div>
</div>
